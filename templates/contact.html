{% extends "base.html" %}
{% block title %}문의하기 — OurBlog{% endblock %}
{% block content %}
<div class="write-wrap">
  <h1>📬 문의하기</h1>
  <p class="subtitle">궁금한 점이 있으면 메일로 보내주세요.</p>

  <div class="form-group">
    <label>이름</label>
    <input type="text" id="name" placeholder="홍길동"/>
  </div>
  <div class="form-group">
    <label>이메일 (답장 받을 주소)</label>
    <input type="email" id="email" placeholder="your@email.com"/>
  </div>
  <div class="form-group">
    <label>제목</label>
    <input type="text" id="subject" placeholder="문의 제목"/>
  </div>
  <div class="form-group">
    <label>내용</label>
    <textarea id="body" rows="8" placeholder="문의 내용을 입력하세요..."></textarea>
  </div>

  <button class="btn-primary" onclick="sendMail()">메일 보내기 →</button>
  <div id="msg" class="msg"></div>
</div>

<script>
async function sendMail() {
  const name    = document.getElementById("name").value.trim();
  const email   = document.getElementById("email").value.trim();
  const subject = document.getElementById("subject").value.trim();
  const body    = document.getElementById("body").value.trim();

  if (!subject || !body) {
    showMsg("제목과 내용을 입력해주세요.", "error");
    return;
  }

  const btn = document.querySelector(".btn-primary");
  btn.disabled = true;
  btn.textContent = "전송 중...";

  try {
    const res  = await fetch("/api/mail", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, subject, body })
    });
    const data = await res.json();
    if (data.success) {
      showMsg("메일이 전송되었습니다! 감사합니다 😊", "success");
      btn.textContent = "전송 완료 ✓";
    } else {
      showMsg("오류: " + data.error, "error");
      btn.disabled = false;
      btn.textContent = "메일 보내기 →";
    }
  } catch(e) {
    showMsg("네트워크 오류가 발생했습니다.", "error");
    btn.disabled = false;
    btn.textContent = "메일 보내기 →";
  }
}

function showMsg(text, type) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg " + type;
}
</script>
{% endblock %}
